<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="University of Juba staff login — access the Academic Insight staff portal.">
    <title>UoJ - Staff Login</title>
    <style>
        :root {
            --primary: #002d62;
            --accent: #ffcc00;
            --error: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        .login-card h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 5px;
            font-size: 1.5rem;
        }

        .login-card p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0,45,98,0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        .btn-login:hover { background: #001a3a; }

        .error {
            color: var(--error);
            font-size: 0.85rem;
            margin-top: 15px;
            text-align: center;
            display: none;
            background: #fdf2f2;
            padding: 10px;
            border-radius: 6px;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--primary);
            text-decoration: none;
        }

        .back-home:hover { text-decoration: underline; }
    </style>
</head>

<body>

    <div class="login-card">
        <h1>University of Juba</h1>
        <p class="subtitle">Academic Insight Staff Portal</p>

        <form id="loginForm">

            <div class="form-group">
                <label for="userSchool">School / College</label>
                <select id="userSchool" required autocomplete="organization">
                    <option value="" disabled selected>Select your school...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="accessCode">Access Code</label>
                <input type="password" id="accessCode" placeholder="Enter Portal Key"
                    autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn-login">Enter Dashboard</button>
            <p id="errorMsg" class="error" aria-live="polite"></p>

        </form>

        <a href="index.html" class="back-home">← Back to Public Website</a>
    </div>

    <script type="module" src="Js/login.js" defer></script>

</body>

</html>
