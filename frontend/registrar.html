<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="University of Juba registry dashboard — manage student issues, announcements, and academic records.">
    <title>Registry Dashboard | University of Juba</title>
    <script>
        (function () {
            const token = sessionStorage.getItem('token');
            const role = sessionStorage.getItem('role');

            // Allow access only if they have a token AND are a registrar/school_admin
            if (!token || (role !== 'registrar' && role !== 'school_admin')) {
                alert('Unauthorized Access.');
                window.location.href = 'login.html';
            }
        })();
    </script>
    <style>
        :root {
            --primary: #002d62;
            --accent: #ffcc00;
            --bg: #f4f7f6;
            --white: #ffffff;
            --text-main: #2d3436;
            --text-light: #636e72;
            --border: #e0e0e0;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            display: flex;
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px;
            background: var(--primary);
            color: white;
            position: fixed;
            height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            z-index: 100;
            overflow-y: auto;
        }

        .sidebar-title {
            font-size: 1.1rem;
            margin-bottom: 40px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            color: white;
        }

        .nav-menu {
            list-style: none;
            flex-grow: 1;
        }

        .nav-menu li {
            margin-bottom: 10px;
        }

        .nav-menu a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            border-radius: 8px;
            transition: 0.3s;
            cursor: pointer;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent);
        }

        .nav-menu svg {
            stroke: currentColor;
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            margin-left: 260px;
            width: calc(100% - 260px);
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 1.5rem;
            color: var(--primary);
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header p {
            margin-top: 4px;
            font-size: 0.9rem;
        }

        /* --- DASHBOARD GRID --- */
        .admin-grid {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 25px;
            align-items: start;
        }

        .admin-grid .card:last-child {
            position: sticky;
            top: 20px;
        }

        .card {
            background: var(--white);
            border-radius: 12px;
            padding: 25px;
            box-shadow: var(--shadow);
        }

        .card h2 {
            margin-bottom: 20px;
            color: var(--primary);
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- TICKET STYLING --- */
        .ticket-list {
            max-height: 550px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .ticket-item {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            border-left: 4px solid var(--primary);
        }

        .ticket-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 5px;
        }

        .student-id {
            font-weight: bold;
            color: var(--primary);
        }

        .date {
            color: var(--text-light);
        }

        /* --- FORM STYLING --- */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        input:focus,
        textarea:focus {
            outline: 2px solid var(--primary);
            border-color: transparent;
        }

        .btn-action {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background: #001d42;
        }

        .ticket-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-btn:hover {
            background: rgba(231, 76, 60, 0.1);
            transform: scale(1.1);
        }

        /* --- MOBILE --- */
        @media (max-width: 900px) {
            .sidebar {
                width: 70px;
                padding: 20px 10px;
            }

            .sidebar-title,
            .nav-menu span {
                display: none;
            }

            .main-content {
                margin-left: 70px;
                width: calc(100% - 70px);
                padding: 20px;
            }

            .admin-grid {
                grid-template-columns: 1fr;
            }

            .admin-grid .card:last-child {
                position: static;
            }
        }

        @media (max-width: 600px) {
            .main-content {
                padding: 15px;
            }

            .header h1 {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar" aria-label="Staff navigation">
        <p class="sidebar-title">School Registry</p>
        <nav>
            <ul class="nav-menu">
                <li>
                    <a href="registrar.html" class="active" aria-current="page">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        </svg>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="index.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <span>Live Portal</span>
                    </a>
                </li>
                <li>
                    <a href="examination.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                            <path d="M9 14l2 2 4-4"></path>
                        </svg>
                        <span>Examination Entry</span>
                    </a>
                </li>
                <li>
                    <a href="addCourse.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 5v14M5 12h14"></path>
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        </svg>
                        <span>Add New Course</span>
                    </a>
                </li>
                <li>
                    <a href="addStudent.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="8.5" cy="7" r="4"></circle>
                            <line x1="20" y1="8" x2="20" y2="14"></line>
                            <line x1="17" y1="11" x2="23" y2="11"></line>
                        </svg>
                        <span>Add New Student</span>
                    </a>
                </li>
                <li>
                    <a href="addDepartment.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        <span>Department Entry</span>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <div class="header">
            <div>
                <h1 id="schoolName">School of Computer Science &amp; IT</h1>
                <p style="color: var(--text-light);">Monitoring Student Issues &amp; Campus News</p>
            </div>
        </div>

        <div class="admin-grid">

            <div class="card">
                <h2>Incoming Student Issues</h2>
                <div id="adminTicketList" class="ticket-list" aria-live="polite"></div>
            </div>

            <div class="card">
                <h2>Post Announcement</h2>
                <form id="announcementForm">
                    <div class="form-group">
                        <label for="annTitle">Headline</label>
                        <input type="text" id="annTitle" placeholder="e.g. New Semester Registration" required
                            autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="annBody">Detailed Message</label>
                        <textarea id="annBody" rows="6" placeholder="Type announcement here..." required
                            autocomplete="off"></textarea>
                    </div>
                    <button type="submit" class="btn-action">Publish Now</button>
                </form>
                <div id="annStatus" style="margin-top:15px; text-align:center;" aria-live="polite"></div>
            </div>

        </div>
    </main>

    <script type="module" src="Js/registrar.js" defer></script>

</body>

</html>
