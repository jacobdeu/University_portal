<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="University portal — register new students into the system.">
    <title>University Portal | Student Registrar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        (function () {
            const token = sessionStorage.getItem('token');
            const role = sessionStorage.getItem('role');

            // Allow access only if they have a token AND are a registrar/school_admin
            if (!token || (role !== 'registrar' && role !== 'school_admin')) {
                alert('Unauthorized Access.');
                window.location.href = 'login.html';
            }
        })();
    </script>
    <style>
        :root {
            --primary-color: #2563eb;
            --success-color: #10b981;
            --error-color: #ef4444;
            --text-main: #1e293b;
            --bg-light: #f1f5f9;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .registrar-container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .card-header {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            padding: 30px;
            border-bottom: 1px solid #e2e8f0;
            text-align: center;
        }

        .card-header i {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .card-header h2 {
            margin: 0;
            color: var(--text-main);
            font-size: 1.5rem;
        }

        .card-header p {
            margin: 10px 0 0;
            color: #64748b;
            font-size: 0.95rem;
        }

        #studentRegistrationForm {
            padding: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-main);
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .form-footer {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            border: none;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            opacity: 0.9;
        }

        .status-msg {
            padding: 0 30px 30px;
            text-align: center;
            font-weight: 600;
            min-height: 24px;

        }

        .status-success {
            color: var(--success-color);
        }

        .status-error {
            color: var(--error-color);
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="registrar-container">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-university" aria-hidden="true"></i>
                <h2>Student Registrar</h2>
                <p>Enter details to add a new student to the system.</p>
            </div>

            <form id="studentRegistrationForm">

                <div class="input-group">
                    <label for="reg_student_id">Official Student ID</label>
                    <input type="text" id="reg_student_id" name="student_id" placeholder="e.g. 22-CYS-011" required
                        autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="reg_student_name">Full Legal Name</label>
                    <input type="text" id="reg_student_name" name="student_name" placeholder="e.g. Jacob Deu" required
                        autocomplete="name">
                </div>

                <div class="input-group">
                    <label for="reg_school_code">School Code (Department)</label>
                    <input type="text" id="reg_school_code" name="school_code" placeholder="e.g. SCS" required
                        autocomplete="off">
                </div>

                <div class="form-footer">
                    <button type="button" class="btn-secondary" id="clearBtn">Clear</button>
                    <button type="submit" class="btn-primary">Register Student</button>
                </div>

            </form>

            <div id="regStatus" class="status-msg" aria-live="polite" role="status"></div>

        </div>

        <div class="back-link">
            <a href="exmination.html"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back to Marks Upload</a>
        </div>
    </div>

    <script type="module" src="Js/addStudent.js" defer></script>

</body>

</html>
