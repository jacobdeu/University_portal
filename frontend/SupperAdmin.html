<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="University portal — add and configure department structural indexing details.">
    <title>UoJ | Master Control</title>
    
    <script>
        (function() {
            const token = sessionStorage.getItem('token');
            const role = sessionStorage.getItem('role');

            // Block access if no token exists OR if the user is not a super_admin
            if (!token || role !== 'super_admin') {
                alert('Unauthorized Access.');
                window.location.href = 'login.html'; 
            }
        })();
    </script>

    <style>
        /* --- Root Variables for Consistency --- */
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #f8fafc;
            --bg-sidebar: #1e293b;
            --text-main: #334155;
            --text-light: #64748b;
            --white: #ffffff;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #22c55e;
            --radius: 8px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        /* --- Base Reset --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            display: flex;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            color: var(--white);
            padding: 2rem 1.5rem;
            position: fixed;
            height: 100vh;
        }

        .sidebar h2 {
            font-size: 1.25rem;
            margin-bottom: 2rem;
            letter-spacing: 1px;
            color: #94a3b8;
            text-align: center;
        }

        .nav-menu {
            list-style: none;
        }

        .nav-menu li {
            margin-bottom: 0.5rem;
        }

        .nav-menu a {
            color: #cbd5e1;
            text-decoration: none;
            padding: 0.75rem 1rem;
            display: block;
            border-radius: var(--radius);
            transition: background 0.3s, color 0.3s;
        }

        .nav-menu a.active, 
        .nav-menu a:hover {
            background-color: var(--primary);
            color: var(--white);
        }

        /* --- Main Content --- */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 2rem;
        }

        .header {
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.8rem;
            color: #0f172a;
            margin-bottom: 0.25rem;
        }

        .header p {
            color: var(--text-light);
        }

        /* --- Cards --- */
        .card {
            background: var(--white);
            padding: 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
            border: 1px solid var(--border);
        }

        .card-header {
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
        }

        /* --- Form, Inputs, & Selects --- */
        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            align-items: flex-end;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-main);
        }

        input, 
        .select-field {
            padding: 0.625rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            width: 100%;
            background-color: var(--white);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, 
        .select-field:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px #bfdbfe; 
        }

        /* --- Buttons --- */
        .btn-primary {
            background-color: var(--primary);
            color: var(--white);
            border: none;
            padding: 0.625rem 1.5rem;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            height: 41px;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #f1f5f9;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.625rem 1.25rem;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background-color: #e2e8f0;
        }

        .btn-edit { 
            color: var(--primary); 
            background: none; 
            border: none; 
            cursor: pointer; 
            margin-right: 10px; 
            font-weight: 600; 
        }
        
        .btn-delete { 
            color: var(--danger); 
            background: none; 
            border: none; 
            cursor: pointer; 
            font-weight: 600; 
        }

        /* --- Table --- */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #f8fafc;
            padding: 1rem;
            font-size: 0.875rem;
            color: var(--text-light);
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        /* --- Modal Overlay --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--white);
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.75rem;
            cursor: pointer;
            color: var(--text-light);
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--danger);
        }

        .modal-body .field {
            margin-bottom: 1.25rem;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        /* --- Status Toast --- */
        .toast-message {
            padding: 1rem;
            border-radius: var(--radius);
            margin-bottom: 1rem;
            display: none;
        }
        .toast-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; display: block; }
        .toast-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; display: block; }
    </style>
</head>

<body>

    <aside class="sidebar">
        <h2>UOJ MASTER</h2>
        <nav>
            <ul class="nav-menu">
                <li><a class="active" href="#"><span>Master Control</span></a></li>
                <li><a href="login.html" id="logoutBtn"><span>Logout</span></a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1>University Master Control</h1>
            <p>Register and Manage Autonomous School Access</p>
        </header>

        <div id="statusMessage" class="toast-message"></div>

        <section class="card">
            <div class="card-header">
                <h3>Register New School / Admin</h3>
            </div>
            <form id="masterPassForm">
                <div class="input-grid">
                    <div class="field">
                        <label for="newCode">School ID</label>
                        <input type="text" id="newCode" required placeholder="e.g. CYS">
                    </div>
                    <div class="field">
                        <label for="newName">Full School Name</label>
                        <input type="text" id="newName" required placeholder="e.g. Cybersecurity">
                    </div>
                    <div class="field">
                        <label for="newRole">Access Role</label>
                        <select id="newRole" class="select-field" required>
                            <option value="school_admin">School Admin (Standard)</option>
                            <option value="super_admin">Super Admin (Full Control)</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="newPass">Initial Access Key</label>
                        <input type="password" id="newPass" required placeholder="Set Password" autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn-primary">Create Account</button>
                </div>
            </form>
        </section>

        <section class="card">
            <div class="card-header">
                <h3>Active School Registrars</h3>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>School Name</th>
                            <th>Role</th>
                            <th>Credentials</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="accessTableBody">
                        <tr>
                            <td colspan="5" style="text-align: center;">Loading schools...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <form id="editForm" onsubmit="return false;">
                <div class="modal-header">
                    <h3>Edit Credentials & Permissions</h3>
                    <button type="button" class="close-btn" onclick="closeModal()" aria-label="Close modal">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="field">
                        <label for="editName">School Name</label>
                        <input type="text" id="editName" autocomplete="username">
                    </div>
                    <div class="field">
                        <label for="editCode">School Code</label>
                        <input type="text" id="editCode">
                    </div>
                    <div class="field">
                        <label for="editRole">Access Role</label>
                        <select id="editRole" class="select-field">
                            <option value="school_admin">School Admin</option>
                            <option value="super_admin">Super Admin</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="editPass">New Access Key (Optional)</label>
                        <input type="password" id="editPass" placeholder="Leave blank to keep current" autocomplete="new-password">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" onclick="closeModal()" class="btn-secondary">Cancel</button>
                    <button type="button" id="saveUpdateBtn" class="btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="Js/supper.js"></script>
</body>

</html>
